<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
    min-height:400px;
}

.logo{
    width:450px;
    max-width:95%;
    animation:
        float 3s ease-in-out infinite,
        glow 2s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}

@keyframes glow{
    0%,100%{
        filter:drop-shadow(0 0 8px #5ec8ff);
    }

    50%{
        filter:
        drop-shadow(0 0 15px #5ec8ff)
        drop-shadow(0 0 25px #5ec8ff);
    }
}
</style>

</head>

<body>

<img
class="logo"
src="https://drive.google.com/uc?export=view&id=12oOy-Uc3JUUTVQ43sA6BX4qlqz-PWd4Y"
alt="Đi Đâu Đây">

</body>
</html>
